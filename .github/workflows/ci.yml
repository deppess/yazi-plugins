name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install StyLua
        run: brew install stylua
      - name: Format
        run: stylua --check .
